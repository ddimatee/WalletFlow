<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WalletFlow - Tu Gestor Financiero Personal</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="inicio.css">
</head>
<body>

  <div class="app-container d-flex align-items-center justify-content-center">
    <!-- Pantalla de Login -->
    <div class="screen">
      <div class="login-container">
        <div class="logo">
          <i class="bi bi-wallet2"></i>
          <h1>WalletFlow</h1>
        </div>
        <h2>Inicia sesión</h2>
        <form id="login-form">
          <div class="mb-3 text-start">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
          </div>

          <div class="mb-3 text-start">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
          </div>

          <div class="form-check mb-3 text-start remember-me">
            <input type="checkbox" class="form-check-input" id="remember">
            <label for="remember" class="form-check-label">Recordar mis datos</label>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100">Iniciar Sesión</button>

          <div class="login-options d-flex justify-content-between mt-3">
            <a href="#" id="forgot-password">¿Olvidaste tu contraseña?</a>
            <a href="../Registro/registro.html" id="go-to-register">Registrarse</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
