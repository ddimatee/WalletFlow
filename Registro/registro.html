<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - WalletFlow</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="registro.css" />
</head>
<body>
  <div class="screen d-flex align-items-center justify-content-center">
    <div class="register-container">
      <div class="logo mb-3">
        <i class="bi bi-wallet2"></i>
        <h1 class="ms-2">WalletFlow</h1>
      </div>
      <h2>Crear una cuenta</h2>
      <form id="register-form">
        <div class="mb-3 text-start">
          <label for="reg-email" class="form-label">Correo Electrónico</label>
          <input type="email" class="form-control" id="reg-email" placeholder="correo@ejemplo.com" required />
        </div>
        <div class="mb-3 text-start">
          <label for="reg-id" class="form-label">Número de Identificación</label>
          <input type="text" class="form-control" id="reg-id" placeholder="Ingresa tu ID" required />
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6 text-start">
            <label for="reg-name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="reg-name" placeholder="Tu nombre" required />
          </div>
          <div class="col-md-6 text-start">
            <label for="reg-lastname" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="reg-lastname" placeholder="Tu apellido" required />
          </div>
        </div>
        <div class="mb-3 text-start">
          <label for="reg-birthdate" class="form-label">Fecha de Nacimiento</label>
          <input type="date" class="form-control" id="reg-birthdate" required />
        </div>
        <div class="mb-3 text-start">
          <label for="reg-username" class="form-label">Nombre de Usuario</label>
          <input type="text" class="form-control" id="reg-username" placeholder="Elige un nombre de usuario" required />
        </div>
        <div class="mb-3 text-start">
          <label for="reg-phone" class="form-label">Teléfono</label>
          <input type="tel" class="form-control" id="reg-phone" placeholder="Tu número de teléfono" required />
        </div>
        <div class="mb-3 text-start">
          <label for="reg-password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="reg-password" placeholder="Mínimo 12 caracteres" required />
          <div class="password-requirements mt-2">
            <p>La contraseña debe tener:</p>
            <ul>
              <li id="length">Al menos 12 caracteres</li>
              <li id="uppercase">Al menos una letra mayúscula</li>
              <li id="number">Al menos un número</li>
              <li id="symbol">Al menos un símbolo (!, @, #, etc.)</li>
            </ul>
          </div>
        </div>
        <div class="mb-3 text-start">
          <label for="reg-confirm-password" class="form-label">Confirmar Contraseña</label>
          <input type="password" class="form-control" id="reg-confirm-password" placeholder="Repite tu contraseña" required />
        </div>
        <button type="submit" class="btn btn-primary-custom w-100">Registrarse</button>
        <div class="login-options mt-4 text-center">
          <a href="#" id="back-to-login">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
